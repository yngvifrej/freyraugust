<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>fri28aug — Sustainability</title>
<meta content="Independent creative studio." name="description"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&amp;display=swap" rel="stylesheet"/>
<style>
    :root {
      --paper: #ffffff;
      --ink: #000000;
      --muted: #707070;
      --baseline: 8px;
      --margin: clamp(20px, 3.25vw, 56px);
      --gutter: clamp(12px, 1.35vw, 24px);
      --max-width: 1800px;
      --font: Helvetica, "Helvetica Neue", Arial, sans-serif;

      /* Swiss typographic scale */
      --type-micro: 12px;
      --type-body: 20px;
      --type-brand: clamp(30px, 2.3vw, 42px);
      --type-nav: clamp(19px, 1.45vw, 24px);
      --type-kicker: 17px;
      --type-lead: clamp(38px, 3.1vw, 54px);
      --type-cap: clamp(26px, 2.1vw, 34px);
      --type-project: clamp(42px, 3.7vw, 58px);
      --type-section: clamp(58px, 5vw, 86px);
      --type-display: clamp(108px, 10vw, 168px);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--paper); }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font);
      font-size: var(--type-body);
      line-height: 1.46;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    a { color: inherit; text-decoration: none; }
    .site { min-height: 100vh; background: #fff; }
    .shell {
      width: min(100%, var(--max-width));
      margin-inline: auto;
      padding-inline: var(--margin);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      column-gap: var(--gutter);
    }

    .site-header {
      position: relative;
      background: #fff;
      color: #000;
      padding-top: 32px;
    }
    .header-inner { align-items: start; }
    .brand {
      grid-column: 1 / span 2;
      font-size: var(--type-brand);
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -.02em;
    }
    .nav {
      grid-column: 8 / span 5;
      display: flex;
      justify-content: flex-end;
      gap: clamp(18px, 2vw, 34px);
      font-size: var(--type-nav);
      line-height: 1.2;
    }
    .nav a { opacity: .72; transition: opacity 140ms ease; }
    .nav a:hover { opacity: 1; }


    .hero {
      min-height: 86svh;
      padding-top: clamp(90px, 12vh, 160px);
      padding-bottom: clamp(70px, 9vh, 120px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hero-label {
      grid-column: 1 / span 4;
      font-size: var(--type-kicker);
      line-height: 1.333;
      text-transform: uppercase;
      letter-spacing: .02em;
      color: var(--muted);
    }
    h1 {
      grid-column: 1 / span 12;
      margin: clamp(48px, 7vh, 88px) 0 0;
      font-size: clamp(112px, 10vw, 174px);
      line-height: .92;
      font-weight: 700;
      letter-spacing: -.04em;
      text-transform: uppercase;
    }
    .hero-bottom { align-items: end; }
    .hero-copy {
      grid-column: 1 / span 6;
      margin: 0;
      max-width: 22ch;
      font-size: var(--type-lead);
      line-height: 1.2;
      letter-spacing: -.018em;
    }
    .hero-data {
      grid-column: 10 / span 3;
      font-size: var(--type-kicker);
      line-height: 1.333;
      text-transform: uppercase;
      letter-spacing: .02em;
      color: var(--muted);
    }

    .section {
      padding-top: clamp(100px, 13vh, 180px);
      padding-bottom: clamp(100px, 13vh, 180px);
    }
    .section-head { margin-bottom: clamp(72px, 9vh, 120px); }
    .section-index {
      grid-column: 1 / span 2;
      font-size: clamp(18px, 1.35vw, 24px);
      line-height: 1.2;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .015em;
      color: var(--ink);
    }
    .section-title {
      grid-column: 4 / span 8;
      margin: 0;
      font-size: var(--type-section);
      line-height: 1.0;
      font-weight: 400;
      letter-spacing: -.035em;
      max-width: 16ch;
    }



    .carousel-block {
      margin-bottom: clamp(88px, 11vh, 152px);
    }
    .carousel-meta {
      grid-column: 1 / span 2;
      align-self: end;
      font-size: var(--type-micro);
      line-height: 1.333;
      text-transform: uppercase;
      letter-spacing: .02em;
      color: var(--muted);
    }
    .carousel-shell {
      grid-column: 2 / span 10;
      min-width: 0;
    }
    .carousel-stage {
      position: relative;
      height: clamp(360px, 48vw, 680px);
      perspective: 1800px;
      perspective-origin: 50% 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .carousel-stage.is-dragging { cursor: grabbing; }
    .carousel-stage.is-dragging .carousel-slide,
    .carousel-stage.is-auto-animating .carousel-slide { transition: none; }
    .carousel-track {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }
    .carousel-slide {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(64%, 760px);
      aspect-ratio: 4 / 3;
      padding: 0;
      border: 0;
      background: transparent;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transform-origin: center center;
      transition: transform 520ms cubic-bezier(.22,.75,.18,1), opacity 420ms ease;
      will-change: transform, opacity;
      cursor: grab;
    }
    .carousel-stage.is-dragging .carousel-slide { cursor: grabbing; }
    .carousel-symbol {
      display: block;
      width: auto;
      height: min(72%, 360px);
      max-width: 76%;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
      backface-visibility: hidden;
      opacity: 1;
      mix-blend-mode: multiply;
      transform: none;
    }
    .carousel-slide:focus-visible { outline: 1px solid #000; outline-offset: 4px; }
    .carousel-ui {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      column-gap: var(--gutter);
      align-items: start;
    }
    .carousel-caption {
      grid-column: 1 / span 6;
      margin: 0;
      font-size: var(--type-micro);
      line-height: 1.333;
      text-transform: uppercase;
      letter-spacing: .02em;
      color: var(--muted);
    }
    .carousel-count {
      grid-column: 7 / span 1;
      font-size: var(--type-micro);
      line-height: 1.333;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .carousel-controls {
      grid-column: 9 / span 2;
      display: flex;
      justify-content: flex-end;
      gap: 20px;
    }
    .carousel-control {
      appearance: none;
      border: 0;
      background: #fff;
      color: var(--ink);
      padding: 0;
      font: inherit;
      font-size: var(--type-micro);
      line-height: 1.333;
      text-transform: uppercase;
      letter-spacing: .02em;
      cursor: pointer;
    }
    .carousel-control:hover { opacity: .55; }

    .projects { display: grid; row-gap: clamp(80px, 11vh, 150px); }
    .project { align-items: start; }
    .project-no {
      grid-column: 1 / span 1;
      font-size: var(--type-micro);
      line-height: 1.333;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .project-title {
      grid-column: 3 / span 5;
      margin: 0;
      font-size: var(--type-project);
      line-height: 1.0;
      font-weight: 700;
      letter-spacing: -.03em;
    }
    .project-copy {
      grid-column: 9 / span 4;
      margin: 0;
      max-width: 38ch;
      font-size: var(--type-body);
      line-height: 1.46;
    }
    .project-meta {
      grid-column: 9 / span 4;
      margin-top: 24px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: var(--type-micro);
      line-height: 1.333;
      text-transform: uppercase;
      letter-spacing: .02em;
      color: var(--muted);
    }

    .capabilities {
      grid-column: 4 / span 8;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: var(--gutter);
      row-gap: 32px;
    }
    .cap {
      font-size: var(--type-cap);
      line-height: 1.15;
      letter-spacing: -.02em;
    }
    .cap small {
      display: block;
      margin-bottom: 8px;
      font-size: var(--type-micro);
      line-height: 1.333;
      font-weight: 400;
      color: var(--muted);
    }

    .statement {
      padding-top: clamp(110px, 14vh, 190px);
      padding-bottom: clamp(110px, 14vh, 190px);
    }
    .statement .lead {
      grid-column: 1 / span 11;
      margin: 0;
      max-width: 14ch;
      font-size: clamp(72px, 6.8vw, 112px);
      line-height: .94;
      font-weight: 400;
      letter-spacing: -.04em;
    }
    .statement .lead strong { font-weight: 700; }
    .statement-note {
      grid-column: 10 / span 3;
      margin-top: 64px;
      font-size: var(--type-micro);
      line-height: 1.333;
      text-transform: uppercase;
      letter-spacing: .02em;
      color: var(--muted);
    }

    .hero-top {
      margin-bottom: clamp(44px, 6vh, 88px);
    }
    .hero-zero-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: clamp(28px, 4vh, 56px);
      padding-bottom: clamp(28px, 4vh, 56px);
    }
    .zero-pyramid {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      row-gap: clamp(2px, .4vw, 10px);
      user-select: none;
      pointer-events: none;
    }
    .zero-row {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: clamp(8px, .9vw, 18px);
      line-height: .78;
      white-space: nowrap;
    }
    .zero-row span {
      display: inline-block;
      font-family: var(--font);
      font-weight: 700;
      color: #000;
      font-size: clamp(126px, 11.5vw, 220px);
      letter-spacing: -.085em;
      transform-origin: center center;
    }
    .zero-row.two span { font-size: clamp(116px, 10.5vw, 198px); }
    .zero-row.one span { font-size: clamp(108px, 9.5vw, 180px); }
    .hero-zero-carousel {
      width: min(100%, 920px);
      margin-inline: auto;
    }
    .hero-zero-carousel .carousel-stage {
      height: clamp(280px, 34vw, 470px);
      perspective: 1800px;
      overflow: visible;
    }
    .hero-zero-carousel .carousel-track {
      width: 100%;
      height: 100%;
    }
    .hero-zero-carousel .carousel-slide {
      width: min(42%, 380px);
      aspect-ratio: 1 / 1;
      background: transparent;
      border: 0;
      padding: 0;
      overflow: visible;
    }
    .zero-cell {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
    .zero-glyph {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(0px, .16vw, 3px);
      font-family: var(--font);
      font-weight: 700;
      line-height: .76;
      letter-spacing: -.1em;
      color: #000;
      pointer-events: none;
    }
    .zero-glyph .zero-row {
      gap: clamp(8px, .9vw, 18px);
      align-items: center;
    }
    .zero-glyph .zero-row span {
      font-size: clamp(82px, 8vw, 148px);
      font-family: var(--font);
      font-weight: 700;
      letter-spacing: -.12em;
    }
    .zero-glyph.variant-2 {
      gap: 0px;
    }
    .zero-glyph.variant-2 .zero-row {
      gap: clamp(10px, 1vw, 20px);
    }
    .zero-glyph.variant-3 {
      transform: scale(1.06);
    }
    .zero-glyph.variant-3 .zero-row.two {
      transform: translateY(-2px);
    }
    .zero-glyph.variant-4 {
      gap: clamp(1px, .24vw, 5px);
    }
    .zero-glyph.variant-4 .zero-row {
      gap: clamp(11px, 1.05vw, 22px);
    }
    .hero-zero-carousel .carousel-ui {
      margin-top: 20px;
      justify-content: center;
    }


    .abracadabra {
      padding-top: clamp(72px, 9vh, 120px);
      padding-bottom: clamp(72px, 9vh, 120px);
      background: #fff;
      overflow: hidden;
    }
    .abracadabra-field {
      grid-column: 1 / span 12;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      font-family: var(--font);
      font-size: clamp(34px, 5vw, 96px); /* JS fits the first row exactly */
      line-height: 1.16;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .hebrew-field {
      font-family: "Frank Ruhl Libre", "Times New Roman", serif;
      direction: ltr;
      unicode-bidi: bidi-override;
      font-weight: 700;
      line-height: .90;
      letter-spacing: .035em;
      font-optical-sizing: auto;
      text-rendering: geometricPrecision;
    }

    .abracadabra-field span {
      display: block;
      width: max-content;
      max-width: none;
      text-align: center;
    }

    .footer {
      background: #fff;
      color: #000;
      padding-top: clamp(110px, 14vh, 190px);
      padding-bottom: 40px;
    }
    .footer-title {
      grid-column: 1 / span 8;
      margin: 0;
      font-size: clamp(112px, 10vw, 174px);
      line-height: .92;
      font-weight: 700;
      letter-spacing: -.04em;
      text-transform: uppercase;
    }
    .footer-contact {
      grid-column: 10 / span 3;
      align-self: end;
      font-size: var(--type-body);
      line-height: 1.46;
    }
    .footer-contact p { margin: 0 0 16px; }
    .footer-contact a { font-weight: 700; }
    .footer-bottom {
      margin-top: clamp(80px, 10vh, 140px);
      font-size: var(--type-micro);
      line-height: 1.333;
      text-transform: uppercase;
      letter-spacing: .02em;
      color: var(--muted);
    }
    .footer-bottom .left { grid-column: 1 / span 4; }
    .footer-bottom .center { grid-column: 5 / span 4; }
    .footer-bottom .right { grid-column: 10 / span 3; text-align: right; }


    .grid-toggle {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
      opacity: .72;
      transition: opacity 140ms ease;
    }
    .grid-toggle:hover,
    .grid-toggle[aria-pressed="true"] { opacity: 1; }

    .grid-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 160ms ease;
      z-index: 999;
    }
    body.show-grid .grid-overlay { opacity: 1; }
    .grid-overlay-shell {
      width: min(100%, var(--max-width));
      height: 100%;
      margin-inline: auto;
      padding-inline: var(--margin);
    }
    .grid-overlay-cols {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      column-gap: var(--gutter);
    }
    .grid-overlay-cols span {
      display: block;
      height: 100%;
      background: rgba(0, 0, 0, 0.05);
      border-left: 1px solid rgba(0, 0, 0, 0.12);
      border-right: 1px solid rgba(0, 0, 0, 0.12);
    }

    @media (max-width: 980px) {
      :root { --margin: 24px; --gutter: 16px; }
      .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .brand { grid-column: 1; }
      .nav { grid-column: 3 / span 4; }
      h1 { grid-column: 1 / span 6; }
      .hero-copy { grid-column: 1 / span 4; font-size: clamp(30px, 8vw, 40px); }
      .hero-data { grid-column: 5 / span 2; }
      .section-index { grid-column: 1; font-size: 16px; }
      .section-title { grid-column: 2 / span 5; }
      .carousel-meta { grid-column: 1; }
      .carousel-shell { grid-column: 2 / span 4; }
      .carousel-stage { height: clamp(340px, 62vw, 560px); }
      .carousel-slide { width: min(70%, 620px); }
      .carousel-symbol { width: auto; height: min(68%, 280px); max-width: 72%; }
      .project-no { grid-column: 1; }
      .project-title { grid-column: 2 / span 3; }
      .project-copy, .project-meta { grid-column: 5 / span 2; }
      .capabilities { grid-column: 2 / span 5; }
      .statement .lead { grid-column: 1 / span 6; }
      .statement-note { grid-column: 5 / span 2; }
      .abracadabra-field { grid-column: 1 / span 6; letter-spacing: .20em; }
      .footer-title { grid-column: 1 / span 4; }
      .footer-contact { grid-column: 5 / span 2; }
      .footer-bottom .left { grid-column: 1 / span 2; }
      .footer-bottom .center { grid-column: 3 / span 2; }
      .footer-bottom .right { grid-column: 5 / span 2; }
      .grid-overlay-cols { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    }

    @media (max-width: 700px) {
      :root { --margin: 16px; --gutter: 12px; }
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .site-header { padding-top: 20px; }
      .brand { grid-column: 1; }
      .nav { grid-column: 2 / span 3; gap: 12px; font-size: 18px; }
      .nav a:nth-child(2) { display: none; }
      .hero { min-height: 84svh; padding-top: 70px; padding-bottom: 52px; }
      .hero-label { grid-column: 1 / span 3; }
      h1 { grid-column: 1 / span 4; font-size: clamp(72px, 18vw, 104px); }
      .hero-copy { grid-column: 1 / span 4; font-size: clamp(30px, 8vw, 40px); }
      .hero-data { grid-column: 1 / span 3; margin-top: 36px; }
      .section { padding-top: 90px; padding-bottom: 90px; }
      .section-head { margin-bottom: 64px; }
      .section-index { grid-column: 1; font-size: 16px; }
      .section-title { grid-column: 2 / span 3; font-size: clamp(58px, 14vw, 86px); }
      .projects { row-gap: 76px; }
      .carousel-block { row-gap: 24px; }
      .carousel-meta { grid-column: 1 / span 4; }
      .carousel-shell { grid-column: 1 / span 4; }
      .carousel-stage { height: clamp(300px, 95vw, 470px); overflow: visible; }
      .carousel-slide { width: 72%; }
      .carousel-symbol { width: auto; height: min(66%, 220px); max-width: 72%; }
      .carousel-ui { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .carousel-caption { grid-column: 1 / span 2; }
      .carousel-count { grid-column: 3; }
      .carousel-controls { grid-column: 4; gap: 12px; }
      .project-no { grid-column: 1; }
      .project-title { grid-column: 2 / span 3; }
      .project-copy { grid-column: 2 / span 3; margin-top: 24px; }
      .project-meta { grid-column: 2 / span 3; margin-top: 16px; }
      .capabilities { grid-column: 2 / span 3; grid-template-columns: 1fr; row-gap: 34px; }
      .statement { padding-top: 96px; padding-bottom: 96px; }
      .statement .lead { grid-column: 1 / span 4; font-size: clamp(52px, 11vw, 76px); }
      .statement-note { grid-column: 2 / span 3; margin-top: 48px; }
      .abracadabra { padding-top: 64px; padding-bottom: 64px; }
      .abracadabra-field { grid-column: 1 / span 4; line-height: 1.18; letter-spacing: .14em; }
      .footer { padding-top: 96px; }
      .footer-title { grid-column: 1 / span 4; }
      .footer-contact { grid-column: 2 / span 3; margin-top: 60px; }
      .footer-bottom { row-gap: 8px; }
      .footer-bottom .left { grid-column: 1 / span 2; }
      .footer-bottom .center { grid-column: 3 / span 2; text-align: right; }
      .footer-bottom .right { grid-column: 1 / span 4; text-align: left; }
      .grid-overlay-cols { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }



    /* 2026 responsive refinement — fluid, mobile-first behavior on top of the Swiss grid */
    html { overflow-x: clip; }
    body { overflow-x: clip; }
    img, svg { max-width: 100%; }
    section, footer { scroll-margin-top: 24px; }

    .shell,
    .grid-overlay-shell {
      padding-left: max(var(--margin), env(safe-area-inset-left));
      padding-right: max(var(--margin), env(safe-area-inset-right));
    }

    .nav a,
    .grid-toggle,
    .carousel-control {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }

    .nav a:focus-visible,
    .grid-toggle:focus-visible,
    .carousel-control:focus-visible,
    .brand:focus-visible,
    .carousel-stage:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
    }

    .hero-copy,
    .project-copy,
    .footer-contact {
      text-wrap: pretty;
    }

    h1,
    .section-title,
    .project-title,
    .statement .lead,
    .footer-title {
      text-wrap: balance;
    }

    .carousel-stage {
      overscroll-behavior-x: contain;
      -webkit-tap-highlight-color: transparent;
    }

    /* Large editorial screens: prevent excessive line length while allowing the grid to breathe. */
    @media (min-width: 1440px) {
      :root {
        --margin: clamp(48px, 3.25vw, 64px);
        --gutter: clamp(20px, 1.35vw, 28px);
      }
      .site-header { padding-top: 36px; }
      .hero { min-height: min(900px, 88svh); }

  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

const canvas = document.getElementById("brainCanvas");
const stage = canvas.closest(".brain-stage");
const loading = document.getElementById("brainLoading");
const state = document.getElementById("brainState");
const resetButton = document.getElementById("brainReset");
const spinButton = document.getElementById("brainSpin");

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: true,
  powerPreference: "high-performance"
});
renderer.setClearColor(0xffffff, 0);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.01, 100);

scene.add(new THREE.HemisphereLight(0xffffff, 0xeef2ff, 2.55));
const key = new THREE.DirectionalLight(0xffffff, 3.35);
key.position.set(4, 6, 7);
scene.add(key);
const fill = new THREE.DirectionalLight(0xe8f3ff, 1.25);
fill.position.set(-5, 1, 3);
scene.add(fill);

const root = new THREE.Group();
root.rotation.y = -0.25;
root.position.set(0, 0, 0);
scene.add(root);

const model = new THREE.Group();
root.add(model);

function extras(o) {
  if (o.userData && o.userData.bx_cat != null) return o.userData;
  if (o.parent && o.parent.userData && o.parent.userData.bx_cat != null) return o.parent.userData;
  return o.userData || {};
}

function cortexMaterial() {
  return new THREE.ShaderMaterial({
    vertexColors: true,
    side: THREE.FrontSide,
    toneMapped: false,
    vertexShader: `
      varying vec3 vColor;
      varying vec3 vNormalV;
      void main() {
        vColor = color;
        vNormalV = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying vec3 vNormalV;
      void main() {
        vec3 N = normalize(vNormalV);
        vec3 L = normalize(vec3(0.35, 0.62, 1.0));
        float d = max(dot(N, L), 0.0);
        float rim = pow(1.0 - abs(N.z), 2.15);
        float light = 1.12 + 0.34 * d + 0.24 * rim;
        vec3 c = min(vColor * light, vec3(1.0));
        c = pow(c, vec3(0.82));
        gl_FragColor = vec4(c, 1.0);
      }
    `
  });
}

// Tractography-style RGB palette shared exactly with the triangle.
// AUDIO = green, TEXT = red, VIDEO = blue.
const MODAL_COLORS = {
  video: new THREE.Color("#0000FF"),
  audio: new THREE.Color("#00FF00"),
  text:  new THREE.Color("#FF0000"),
  neutral: new THREE.Color("#FFFFFF")
};

function gaussian(value, center, sigma) {
  const d = (value - center) / sigma;
  return Math.exp(-0.5 * d * d);
}

function clamp01(v) {
  return Math.max(0, Math.min(1, v));
}

function sigmoid(x) {
  return 1 / (1 + Math.exp(-x));
}

function functionalLabelBoost(labelRaw = "") {
  const label = String(labelRaw).toLowerCase();

  let video = 0;
  let audio = 0;
  let text = 0;

  // Visual-biased posterior cortex.
  if (
    label.includes("occipital") ||
    label.includes("calcarine") ||
    label.includes("cuneus") ||
    label.includes("lingual") ||
    label.includes("occipitotemporal") ||
    label.includes("fusiform")
  ) video += 0.75;

  // Auditory-biased superior/transverse temporal cortex.
  if (
    label.includes("superior temporal") ||
    label.includes("transverse temporal") ||
    label.includes("heschl") ||
    label.includes("temporal plane")
  ) audio += 0.85;

  // Language/text-biased left fronto-temporo-parietal regions.
  if (
    label.includes("inferior frontal") ||
    label.includes("opercular") ||
    label.includes("triangular") ||
    label.includes("angular") ||
    label.includes("supramarginal") ||
    label.includes("middle temporal")
  ) text += 0.65;

  return { video, audio, text };
}

function applyIllustrativeMultimodalColors(meshes, bounds) {
  const center = bounds.getCenter(new THREE.Vector3());
  const size = bounds.getSize(new THREE.Vector3());
  const half = new THREE.Vector3(
    Math.max(size.x * 0.5, 1e-6),
    Math.max(size.y * 0.5, 1e-6),
    Math.max(size.z * 0.5, 1e-6)
  );

  const world = new THREE.Vector3();
  const local = new THREE.Vector3();
  const modal = new THREE.Color();

  meshes.forEach(mesh => {
    // Clone so each anatomical mesh can own its color attribute safely.
    mesh.geometry = mesh.geometry.clone();
    const geometry = mesh.geometry;
    const pos = geometry.getAttribute("position");
    if (!pos) return;

    mesh.updateWorldMatrix(true, false);

    const ex = extras(mesh);
    const label = ex.bx_label || mesh.name || "";
    const side = ex.bx_side || "";
    const labelBoost = functionalLabelBoost(label);

    const colors = new Float32Array(pos.count * 3);

    for (let i = 0; i < pos.count; i++) {
      local.fromBufferAttribute(pos, i);
      world.copy(local).applyMatrix4(mesh.matrixWorld);

      // Z-Anatomy model axes:
      // +X = anatomical left, +Y = posterior, +Z = superior.
      const x = (world.x - center.x) / half.x;
      const y = (world.y - center.y) / half.y;
      const z = (world.z - center.z) / half.z;

      // Broad illustrative territories rather than hard parcels.
      let video =
        0.035 +
        1.20 * gaussian(y, 0.72, 0.40) *
        gaussian(z, 0.00, 0.84);

      let audio =
        0.035 +
        1.20 * gaussian(Math.abs(x), 0.72, 0.28) *
        gaussian(y, 0.04, 0.47) *
        gaussian(z, -0.30, 0.39);

      // +X is left in this model. Text is intentionally left-biased,
      // with both frontal and temporo-parietal lobes represented.
      const leftBias = 0.25 + 0.75 * sigmoid(4.5 * x);
      let text =
        0.035 +
        leftBias * (
          0.86 * gaussian(y, -0.52, 0.39) * gaussian(z, 0.03, 0.56) +
          0.72 * gaussian(y,  0.10, 0.44) * gaussian(z, -0.12, 0.46)
        );

      // Anatomical label metadata gently reinforces the intended regions.
      video += labelBoost.video;
      audio += labelBoost.audio;
      text  += labelBoost.text * (side === "left" ? 1.0 : 0.38);

      const total = Math.max(video + audio + text, 1e-6);

      // Sharpen the dominant modality so the surface reads more like
      // saturated DTI / tractography RGB while retaining smooth mixtures.
      let wv = Math.pow(video / total, 3.05);
      let wa = Math.pow(audio / total, 3.05);
      let wt = Math.pow(text  / total, 3.05);
      const sharpTotal = Math.max(wv + wa + wt, 1e-6);
      wv /= sharpTotal;
      wa /= sharpTotal;
      wt /= sharpTotal;

      modal.setRGB(
        MODAL_COLORS.video.r * wv + MODAL_COLORS.audio.r * wa + MODAL_COLORS.text.r * wt,
        MODAL_COLORS.video.g * wv + MODAL_COLORS.audio.g * wa + MODAL_COLORS.text.g * wt,
        MODAL_COLORS.video.b * wv + MODAL_COLORS.audio.b * wa + MODAL_COLORS.text.b * wt
      );

      colors[i * 3 + 0] = modal.r;
      colors[i * 3 + 1] = modal.g;
      colors[i * 3 + 2] = modal.b;
    }

    geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
    mesh.material = cortexMaterial();
  });
}

const draco = new DRACOLoader();
draco.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.7/");

const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

// Production deployment provides ./models/brain.glb.
// The upstream fallback keeps the file inspectable before the local asset is fetched.
const MODEL_URLS = [
  "./models/brain.glb",
  "https://itayinbarr.github.io/brainproject/models/brain.glb"
];

let cortexMeshes = [];
let loadedModel = false;

async function tryLoad(index = 0) {
  if (index >= MODEL_URLS.length) {
    console.error("Brain model could not load");
    state.textContent = "ERROR";
    return;
  }

  loader.load(
    MODEL_URLS[index],
    gltf => {
      model.clear();
      model.add(gltf.scene);
      cortexMeshes = [];

      gltf.scene.traverse(o => {
        if (!o.isMesh) return;
        const ex = extras(o);
        const cat = ex.bx_cat || "other";
        const side = ex.bx_side || "median";

        // The GLB contains many anatomical systems. This design intentionally
        // shows cortex only, keeping the page visually minimal.
        o.visible = cat === "cortex";

        if (o.visible) {
          cortexMeshes.push(o);
          o.castShadow = false;
          o.receiveShadow = false;
        }
      });

      if (!cortexMeshes.length) {
        console.error("Cortex metadata not found");
        state.textContent = "ERROR";
        return;
      }

      // Center on cortex and scale it exactly as a stage object.
      const core = new THREE.Box3();
      cortexMeshes.forEach(m => core.expandByObject(m));

      // Apply the three-way Video / Audio / Text blend directly to cortical vertices.
      applyIllustrativeMultimodalColors(cortexMeshes, core);

      const center = core.getCenter(new THREE.Vector3());
      gltf.scene.position.sub(center);

      const radius = core.getBoundingSphere(new THREE.Sphere()).radius || 1;
      model.scale.setScalar(1.46 / radius);

      // Z-Anatomy exports anterior toward +Z; turn anterior toward camera.
      model.rotation.y = Math.PI;

      loading.hidden = true;
      state.textContent = "V/A/T";
      loadedModel = true;
      resetView();
    },
    undefined,
    err => {
      console.warn("Brain load failed:", MODEL_URLS[index], err);
      tryLoad(index + 1);
    }
  );
}

const target = new THREE.Vector3(0, 0, 0);
const spherical = new THREE.Spherical(7.45, Math.PI / 2.22, 0.50);
const goal = spherical.clone();

let dragging = false;
let lastX = 0;
let lastY = 0;
let autoRotate = true;

function applyCamera() {
  const offset = new THREE.Vector3().setFromSpherical(spherical);
  camera.position.copy(target).add(offset);
  camera.lookAt(target);
}

function resetView() {
  goal.set(7.45, Math.PI / 2.22, 0.50);
  spherical.copy(goal);
  root.rotation.y = -0.25;
  autoRotate = true;
  spinButton.textContent = "PAUSE";
  applyCamera();
}

stage.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  autoRotate = false;
  spinButton.textContent = "SPIN";
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
});

stage.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;

  goal.theta -= dx * 0.006;
  goal.phi = Math.max(0.18, Math.min(Math.PI - 0.18, goal.phi - dy * 0.006));
});

function endDrag(e) {
  dragging = false;
  try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

stage.addEventListener("wheel", e => {
  e.preventDefault();
  autoRotate = false;
  spinButton.textContent = "SPIN";
  goal.radius = Math.max(3.0, Math.min(13, goal.radius * (1 + e.deltaY * 0.0009)));
}, { passive:false });

resetButton.addEventListener("click", resetView);
spinButton.addEventListener("click", () => {
  autoRotate = !autoRotate;
  spinButton.textContent = autoRotate ? "PAUSE" : "SPIN";
});

function resize() {
  const rect = stage.getBoundingClientRect();
  const width = Math.max(1, Math.round(rect.width));
  const height = Math.max(1, Math.round(rect.height));

  renderer.setSize(width, height, false);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
}

function frame() {
  requestAnimationFrame(frame);
  resize();

  if (autoRotate && loadedModel && !dragging) {
    goal.theta += 0.0014;
  }

  spherical.radius += (goal.radius - spherical.radius) * 0.11;
  spherical.phi += (goal.phi - spherical.phi) * 0.11;

  let dTheta = goal.theta - spherical.theta;
  while (dTheta > Math.PI) dTheta -= Math.PI * 2;
  while (dTheta < -Math.PI) dTheta += Math.PI * 2;
  spherical.theta += dTheta * 0.11;

  applyCamera();
  renderer.render(scene, camera);
}

window.addEventListener("resize", resize);
resetView();
tryLoad();
frame();
</script>

<script>
(function () {
  const stage = document.querySelector('.brain-stage');
  const orbit = document.getElementById('sdgOrbit');
  const linksSvg = document.getElementById('sdgLinks');
  const info = document.getElementById('sdgInfo');
  if (!stage || !orbit || !linksSvg || !info) return;

  const sdgs = [
    { id: 1,  title: 'No Poverty', lines: ['No', 'Poverty'], color: '#E5243B', rel: [2,3,4,8,10,11,16,17] },
    { id: 2,  title: 'Zero Hunger', lines: ['Zero', 'Hunger'], color: '#DDA63A', rel: [1,3,6,12,13,15,17] },
    { id: 3,  title: 'Good Health and Well-Being', lines: ['Good Health', 'and Well-Being'], color: '#4C9F38', rel: [2,4,5,6,10,11,13,16] },
    { id: 4,  title: 'Quality Education', lines: ['Quality', 'Education'], color: '#C5192D', rel: [1,3,5,8,9,10,16,17] },
    { id: 5,  title: 'Gender Equality', lines: ['Gender', 'Equality'], color: '#FF3A21', rel: [3,4,8,10,16,17] },
    { id: 6,  title: 'Clean Water and Sanitation', lines: ['Clean Water', 'and Sanitation'], color: '#26BDE2', rel: [2,3,11,12,13,14,15] },
    { id: 7,  title: 'Affordable and Clean Energy', lines: ['Affordable and', 'Clean Energy'], color: '#FCC30B', rel: [8,9,11,12,13,17] },
    { id: 8,  title: 'Decent Work and Economic Growth', lines: ['Decent Work', 'and Economic Growth'], color: '#A21942', rel: [1,4,5,7,9,10,12,17] },
    { id: 9,  title: 'Industry, Innovation and Infrastructure', lines: ['Industry, Innovation', 'and Infrastructure'], color: '#FD6925', rel: [4,7,8,11,12,13,17] },
    { id: 10, title: 'Reduced Inequalities', lines: ['Reduced', 'Inequalities'], color: '#DD1367', rel: [1,3,4,5,8,11,16,17] },
    { id: 11, title: 'Sustainable Cities and Communities', lines: ['Sustainable Cities', 'and Communities'], color: '#FD9D24', rel: [1,3,6,7,9,10,12,13,16] },
    { id: 12, title: 'Responsible Consumption and Production', lines: ['Responsible Consumption', 'and Production'], color: '#BF8B2E', rel: [2,6,7,8,9,11,13,14,15] },
    { id: 13, title: 'Climate Action', lines: ['Climate', 'Action'], color: '#3F7E44', rel: [2,3,6,7,9,11,12,14,15,17] },
    { id: 14, title: 'Life Below Water', lines: ['Life Below', 'Water'], color: '#0A97D9', rel: [6,12,13,15,17] },
    { id: 15, title: 'Life on Land', lines: ['Life on', 'Land'], color: '#56C02B', rel: [2,6,12,13,14,17] },
    { id: 16, title: 'Peace, Justice and Strong Institutions', lines: ['Peace, Justice', 'and Strong', 'Institutions'], color: '#00689D', rel: [1,3,4,5,10,11,17] },
    { id: 17, title: 'Partnerships for the Goals', lines: ['Partnerships', 'for the Goals'], color: '#19486A', rel: [1,2,4,5,7,8,9,10,13,14,15,16] }
  ].map(sdg => ({ ...sdg, url: `https://sdgs.un.org/goals/goal${sdg.id}` }));

  const ittenPalette = ["#F2CC21", "#D97A2B", "#C83B31", "#6F4A8E", "#2D4F9D", "#4F7E38"];
  sdgs.forEach((sdg, i) => { sdg.color = ittenPalette[i % ittenPalette.length]; });

  const byId = new Map(sdgs.map(s => [s.id, s]));
  const nodeMap = new Map();
  let active = null;

  const edgeKeys = [];
  const adjacency = new Map(sdgs.map(s => [s.id, new Set()]));
  sdgs.forEach((sdg) => {
    sdg.rel.forEach((otherId) => {
      if (!byId.has(otherId) || otherId === sdg.id) return;
      adjacency.get(sdg.id).add(otherId);
      adjacency.get(otherId).add(sdg.id);
    });
  });
  adjacency.forEach((set, id) => {
    [...set].sort((a,b)=>a-b).forEach((otherId) => {
      if (id < otherId) edgeKeys.push([id, otherId]);
    });
  });

  function createNodes() {
    orbit.innerHTML = '';
    sdgs.forEach((sdg) => {
      const link = document.createElement('a');
      link.className = 'sdg-node';
      link.href = sdg.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.style.setProperty('--sdg-color', sdg.color);
      link.setAttribute('aria-label', `SDG ${sdg.id}: ${sdg.title}. Open official United Nations SDG page.`);
      link.dataset.id = String(sdg.id);
      link.dataset.color = sdg.color;
      link.title = `SDG ${sdg.id} — ${sdg.title}`;

      const num = document.createElement('span');
      num.className = 'sdg-num';
      num.textContent = String(sdg.id);

      const title = document.createElement('span');
      title.className = 'sdg-title';
      title.innerHTML = sdg.lines.map(line => `<span>${line}</span>`).join('');

      link.appendChild(num);
      link.appendChild(title);

      link.addEventListener('mouseenter', () => setActive(sdg.id));
      link.addEventListener('focus', () => setActive(sdg.id));
      link.addEventListener('click', (e) => {
        // Do not prevent default: click opens the official UN page.
        e.stopPropagation();
      });

      orbit.appendChild(link);
      nodeMap.set(sdg.id, link);
    });
  }

  function circleLayout() {
    const rect = stage.getBoundingClientRect();
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    const nodeSample = nodeMap.get(1);
    const nodeBox = nodeSample ? nodeSample.getBoundingClientRect() : {
      width: (window.innerWidth <= 700 ? 64 : window.innerWidth <= 1024 ? 80 : 96),
      height: (window.innerWidth <= 700 ? 64 : window.innerWidth <= 1024 ? 80 : 96)
    };
    const nodeHalf = Math.max(nodeBox.width, nodeBox.height) / 2;
    const padding = window.innerWidth <= 700 ? 12 : window.innerWidth <= 1024 ? 18 : 24;
    const radius = Math.min(cx, cy) - nodeHalf - padding;
    const start = -Math.PI / 2;

    sdgs.forEach((sdg, i) => {
      const angle = start + (Math.PI * 2 * i / sdgs.length);
      const x = cx + radius * Math.cos(angle);
      const y = cy + radius * Math.sin(angle);
      const el = nodeMap.get(sdg.id);
      if (el) {
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
      }
    });
    drawLinks();
  }

  function getNodeCenter(id) {
    const el = nodeMap.get(id);
    if (!el) return null;
    return {
      x: parseFloat(el.style.left || '0'),
      y: parseFloat(el.style.top || '0'),
      color: el.dataset.color || '#000'
    };
  }

  function curvedPath(a, b, cx, cy) {
    const mx = (a.x + b.x) / 2;
    const my = (a.y + b.y) / 2;
    const c1x = mx + (cx - mx) * 0.55;
    const c1y = my + (cy - my) * 0.55;
    return `M ${a.x.toFixed(1)} ${a.y.toFixed(1)} Q ${c1x.toFixed(1)} ${c1y.toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`;
  }

  function drawLinks() {
    const rect = stage.getBoundingClientRect();
    linksSvg.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
    linksSvg.innerHTML = '';

    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    linksSvg.appendChild(defs);
    const cx = rect.width / 2;
    const cy = rect.height / 2;

    edgeKeys.forEach(([idA, idB]) => {
      const a = getNodeCenter(idA);
      const b = getNodeCenter(idB);
      if (!a || !b) return;

      const key = `${idA}-${idB}`;
      const grad = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
      grad.id = `link-grad-${key}`;
      grad.setAttribute('gradientUnits', 'userSpaceOnUse');
      grad.setAttribute('x1', String(a.x));
      grad.setAttribute('y1', String(a.y));
      grad.setAttribute('x2', String(b.x));
      grad.setAttribute('y2', String(b.y));

      const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
      stop1.setAttribute('offset', '0%');
      stop1.setAttribute('stop-color', a.color);
      stop1.setAttribute('stop-opacity', '.82');
      grad.appendChild(stop1);

      const stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
      stop2.setAttribute('offset', '100%');
      stop2.setAttribute('stop-color', b.color);
      stop2.setAttribute('stop-opacity', '.82');
      grad.appendChild(stop2);
      defs.appendChild(grad);

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', curvedPath(a, b, cx, cy));
      path.setAttribute('stroke', `url(#link-grad-${key})`);
      path.dataset.a = String(idA);
      path.dataset.b = String(idB);
      linksSvg.appendChild(path);
    });

    updateActiveVisuals();
  }

  function updateActiveVisuals() {
    const paths = linksSvg.querySelectorAll('path');
    if (!active) {
      nodeMap.forEach((el) => el.classList.remove('is-active', 'is-related', 'is-dim'));
      paths.forEach((p) => {
        p.classList.remove('is-active');
        p.style.opacity = '.34';
      });
      info.textContent = '';
      return;
    }

    const related = adjacency.get(active) || new Set();
    nodeMap.forEach((el, id) => {
      const num = Number(id);
      el.classList.toggle('is-active', num === active);
      el.classList.toggle('is-related', num !== active && related.has(num));
      el.classList.toggle('is-dim', num !== active && !related.has(num));
    });

    paths.forEach((p) => {
      const a = Number(p.dataset.a);
      const b = Number(p.dataset.b);
      const on = a === active || b === active;
      p.classList.toggle('is-active', on);
      p.style.opacity = on ? '.98' : '.10';
    });

    const sdg = byId.get(active);
    if (sdg) {
      const ids = [...related].sort((a,b)=>a-b).join(', ');
      info.textContent = `SDG ${sdg.id} — ${sdg.title}. Connected with SDGs ${ids}.`;
    }
  }

  function setActive(id) {
    active = id;
    updateActiveVisuals();
  }

  stage.addEventListener('mouseleave', () => setActive(null));
  document.addEventListener('click', (e) => {
    if (!stage.contains(e.target)) setActive(null);
  });
  window.addEventListener('resize', circleLayout);

  createNodes();
  circleLayout();
})();
</script>


<script>
/* Keep modality navigation clicks separate from brain drag controls. */
document.querySelectorAll('.neon-triangle-labels-outside a').forEach((link) => {
  ['pointerdown','mousedown','touchstart'].forEach((type) => {
    link.addEventListener(type, (event) => event.stopPropagation(), { passive: true });
  });
});
</script>

</body>
