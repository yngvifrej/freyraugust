<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>fri28aug — About</title>
<meta name="description" content="fri28aug"/>
<style>
:root{--paper:#fff;--ink:#000;--muted:#707070;--margin:clamp(20px,3.25vw,56px);--gutter:clamp(12px,1.35vw,24px);--max-width:1800px;--font:Helvetica,"Helvetica Neue",Arial,sans-serif;}
*,*::before,*::after{box-sizing:border-box} html{background:#fff} body{margin:0;background:#fff;color:#000;font-family:var(--font);-webkit-font-smoothing:antialiased} a{color:inherit;text-decoration:none} .site{min-height:100vh} .shell{width:min(100%,var(--max-width));margin-inline:auto;padding-inline:var(--margin)} .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gutter)}
.site-header{padding-top:32px;background:#fff;position:relative;z-index:50} .header-inner{align-items:start;row-gap:10px} .brand{grid-column:1/span 2;font-size:clamp(30px,2.3vw,42px);line-height:1.2;font-weight:700;letter-spacing:-.02em} .main-nav{grid-column:5/span 8;display:flex;justify-content:flex-end;align-items:baseline;gap:clamp(14px,1.65vw,30px);font-size:clamp(12px,.95vw,15px);font-weight:700;line-height:1.2;text-transform:uppercase;white-space:nowrap} .main-nav a{opacity:.44} .main-nav a:hover,.main-nav a:focus-visible,.main-nav a[aria-current="page"]{opacity:1}
.content-page{min-height:calc(100svh - 92px);padding-top:clamp(76px,10vh,132px);padding-bottom:clamp(72px,10vh,132px)} .page-kicker{grid-column:1/span 2;margin:0;font-size:12px;line-height:1.2;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)} .page-title{grid-column:3/span 10;margin:0;font-size:clamp(72px,9.2vw,156px);line-height:.86;font-weight:700;letter-spacing:-.055em;text-transform:uppercase} .empty-space{min-height:clamp(260px,48vh,620px);border-bottom:1px solid rgba(0,0,0,.14)}

/* === V28 common site navigation === */
.site-header { z-index: 50; }
.site-nav-grid { align-items: start; row-gap: 10px; }
.main-nav {
  grid-column: 5 / span 8;
  display: flex;
  justify-content: flex-end;
  align-items: baseline;
  gap: clamp(14px, 1.65vw, 30px);
  font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
  font-size: clamp(12px, .95vw, 15px);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: .01em;
  text-transform: uppercase;
  white-space: nowrap;
}
.main-nav a { opacity: .44; transition: opacity 140ms ease; }
.main-nav a:hover,
.main-nav a:focus-visible,
.main-nav a[aria-current="page"] { opacity: 1; }

/* AUDIO becomes an actual page link while keeping the exact triangle geometry. */
.neon-triangle-labels-outside { z-index: 14 !important; }
.neon-triangle-labels-outside .label-audio {
  pointer-events: auto !important;
  cursor: pointer !important;
  text-decoration: none !important;
}
.neon-triangle-labels-outside .label-audio:hover,
.neon-triangle-labels-outside .label-audio:focus-visible {
  text-decoration: underline !important;
  text-decoration-thickness: 2px !important;
  text-underline-offset: 5px !important;
  outline: none !important;
}

/* Common editorial pages */
.content-page {
  min-height: calc(100svh - 92px);
  padding-top: clamp(76px, 10vh, 132px);
  padding-bottom: clamp(72px, 10vh, 132px);
}
.page-kicker {
  grid-column: 1 / span 2;
  margin: 0;
  font-size: 12px;
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: .02em;
  text-transform: uppercase;
  color: var(--muted);
}
.page-title {
  grid-column: 3 / span 10;
  margin: 0;
  font-size: clamp(72px, 9.2vw, 156px);
  line-height: .86;
  font-weight: 700;
  letter-spacing: -.055em;
  text-transform: uppercase;
}
.empty-space {
  min-height: clamp(260px, 48vh, 620px);
  border-bottom: 1px solid rgba(0,0,0,.14);
}

/* AUDIO page */
.audio-page .page-title { color: #66762c; }
.audio-list {
  margin-top: clamp(72px, 10vh, 124px);
  border-top: 1px solid #000;
}
.audio-item {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  column-gap: var(--gutter);
  padding: 18px 0 22px;
  border-bottom: 1px solid rgba(0,0,0,.20);
}
.audio-index {
  grid-column: 1 / span 1;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.2;
}
.audio-copy {
  grid-column: 2 / span 3;
  align-self: start;
}
.audio-copy h2 {
  margin: 0 0 8px;
  font-size: clamp(19px, 1.5vw, 25px);
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -.02em;
}
.audio-copy p {
  margin: 0;
  font-size: 11px;
  line-height: 1.35;
  text-transform: uppercase;
  letter-spacing: .02em;
  color: var(--muted);
}
.audio-embed {
  grid-column: 5 / span 8;
}
.audio-embed iframe {
  width: 100%;
  height: 166px;
  display: block;
  border: 0;
  background: #f3f3f3;
}
.release-link {
  display: flex;
  min-height: 166px;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  padding: 18px 0 8px;
  border-top: 1px solid #000;
  border-bottom: 1px solid #000;
  font-size: clamp(21px, 2.1vw, 34px);
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -.025em;
}
.release-link .arrow { font-size: 1.1em; font-weight: 400; }

@media (max-width: 900px) {
  .main-nav { grid-column: 4 / span 9; gap: 15px; font-size: 12px; }
  .page-title { grid-column: 2 / span 11; }
  .audio-copy { grid-column: 2 / span 4; }
  .audio-embed { grid-column: 6 / span 7; }
}
@media (max-width: 700px) {
  .site-nav-grid .brand { grid-column: 1 / span 4 !important; }
  .main-nav {
    grid-column: 1 / span 4;
    justify-content: flex-start;
    flex-wrap: wrap;
    gap: 8px 16px;
    margin-top: 8px;
    white-space: normal;
  }
  .content-page { padding-top: 56px; }
  .page-kicker { grid-column: 1 / span 4; margin-bottom: 28px; }
  .page-title { grid-column: 1 / span 4; font-size: clamp(58px, 18vw, 94px); }
  .audio-item { row-gap: 18px; }
  .audio-index { grid-column: 1 / span 1; }
  .audio-copy { grid-column: 2 / span 3; }
  .audio-embed { grid-column: 1 / span 4; }
  .release-link { min-height: 120px; font-size: 22px; }
}

</style>
</head>
<body>
<div class="site">
<header class="site-header">
<div class="shell">
<div class="grid header-inner site-nav-grid">
<a aria-label="fri28aug home" class="brand" href="index.html">fri28aug</a>
<nav class="main-nav" aria-label="Primary"><a href="about.html" aria-current="page">About</a><a href="services.html">Services</a><a href="sustainability.html">Sustainability</a><a href="news.html">News</a><a href="contact.html">Contact</a></nav>
</div>
</div>
</header>
<main class="shell content-page">
<div class="grid"><p class="page-kicker">fri28aug</p><h1 class="page-title">About</h1></div>
<div class="empty-space" aria-hidden="true"></div>
</main>
</div>
</body>
</html>
