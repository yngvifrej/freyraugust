*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Helvetica,"Helvetica Neue",Arial,sans-serif}
body{min-width:320px;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.site{min-height:100vh}
.shell{width:min(100%,var(--max));margin:0 auto;padding:0 var(--margin)}

header{padding-top:28px}
.header-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.brand{grid-column:1/span 3;font-size:clamp(28px,2.25vw,42px);font-weight:700;letter-spacing:-.025em}
nav{grid-column:6/span 7;display:flex;justify-content:flex-end;gap:clamp(14px,2vw,32px);font-size:clamp(14px,1.25vw,20px)}

main{padding-bottom:48px}
.hero{min-height:calc(100vh - 88px);display:grid;place-items:center}
.stage{
  position:relative;
  width:min(100%,1180px);
  height:clamp(560px,66vw,820px);
  overflow:visible;
  touch-action:pan-y pinch-zoom;
}

/* MATHEMATICALLY NORMAL EQUILATERAL TRIANGLE.
   Width / height = 2 / sqrt(3) = 1.154700538. */
.triangle-frame,
.labels-frame,
.brain-fallback-frame {
  position:absolute;
  left:50%;
  top:50%;
  width:min(84%,var(--triangle-max));
  aspect-ratio:1.154700538 / 1;
  transform:translate(-50%,-33.333333%);
  transform-origin:50% 33.333333%;
}

.triangle-frame {
  z-index:1;
  clip-path:polygon(0 0,100% 0,50% 100%);
  background-image:var(--shared-gradient-image);
  background-size:100% 100%;
  background-position:0 0;
  background-repeat:no-repeat;
}

/* Offline/no-WebGL fallback.
   Same exact gradient image; only the brain-shaped mask is different. */
.brain-fallback-frame{z-index:2;pointer-events:none}
.brain-fallback {
  position:absolute;
  left:31%;
  top:16%;
  width:38%;
  aspect-ratio:475 / 459;
  background-image:var(--shared-gradient-image);
  background-size:100% 100%;
  background-position:0 0;
  background-repeat:no-repeat;
  -webkit-mask-image:var(--brain-mask);
  mask-image:var(--brain-mask);
  -webkit-mask-size:100% 100%;
  mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat;
  mask-repeat:no-repeat;
  filter:drop-shadow(0 0 1px rgba(255,255,255,.95)) drop-shadow(0 0 1.5px rgba(0,0,0,.70));
}
.brain-fallback-frame.hidden{opacity:0}


.triangle-outline{
  position:absolute;
  z-index:4;
  left:50%;
  top:50%;
  width:min(84%,var(--triangle-max));
  aspect-ratio:1.154700538 / 1;
  transform:translate(-50%,-33.333333%);
  transform-origin:50% 33.333333%;
  overflow:visible;
  pointer-events:none;
}
.triangle-outline polygon{
  fill:none;
  stroke:rgba(17,17,17,.58);
  stroke-width:1.5;
  vector-effect:non-scaling-stroke;
}

#brainCanvas {
  position:absolute;
  inset:0;
  z-index:3;
  width:100%;
  height:100%;
  display:block;
}

.labels-frame{z-index:5;pointer-events:none;font-size:clamp(16px,1.45vw,24px);font-weight:700;letter-spacing:-.015em}
.labels-frame a{position:absolute;pointer-events:auto}
.label-sound{left:0;top:0;transform:translate(-5%,-130%)}
.label-language{right:0;top:0;transform:translate(5%,-130%)}
.label-vision{left:50%;bottom:0;transform:translate(-50%,135%)}

.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap}

html.embed-page header{display:none}
html.embed-page .hero{min-height:100vh}
html.embed-page .stage{height:clamp(520px,72vw,820px)}

@media(max-width:900px){
  nav{grid-column:5/span 8;gap:14px;flex-wrap:wrap}
  .stage{height:clamp(520px,82vw,720px)}
  .triangle-frame,.labels-frame,.brain-fallback-frame,.triangle-outline{width:min(82%,660px)}
}
@media(max-width:700px){
  header{padding-top:18px}
  .brand{grid-column:1/span 12}
  nav{grid-column:1/span 12;justify-content:flex-start;margin-top:8px;font-size:12px}
  .stage{height:clamp(450px,125vw,650px)}
  .triangle-frame,.labels-frame,.brain-fallback-frame,.triangle-outline{width:min(78vw,500px)}
  .labels-frame{font-size:clamp(11px,3.1vw,15px)}
}
@media(max-width:430px){
  .triangle-frame,.labels-frame,.brain-fallback-frame,.triangle-outline{width:min(72vw,390px)}
}

sharedTexture.colorSpace = THREE.SRGBColorSpace;
sharedTexture.wrapS = THREE.ClampToEdgeWrapping;
sharedTexture.wrapT = THREE.ClampToEdgeWrapping;
sharedTexture.minFilter = THREE.LinearFilter;
sharedTexture.magFilter = THREE.LinearFilter;

const brainGroup = new THREE.Group();
scene.add(brainGroup);

let cortexMeshes = [];
let radius = 4.8;
let theta = 0.15;
let phi = 1.35;
let targetTheta = theta;
let targetPhi = phi;
let autoRotate = true;
let dragging = false;
let px = 0, py = 0;

function meshMetadata(o) {
  const own = o.userData || {};
  const parent = (o.parent && o.parent.userData) || {};
  return Object.assign({}, parent, own);
}

function selectCortex(root) {
  const all = [];
  const cortex = [];
  root.traverse(o => {
    if (!o.isMesh || !o.geometry) return;
    all.push(o);
    const meta = meshMetadata(o);
    const cat = String(meta.bx_cat || meta.category || "").toLowerCase();
    if (cat.includes("cortex") || cat.includes("cortical")) cortex.push(o);
  });
  return cortex.length ? cortex : all;
}

function applyExactSharedTexture(meshes, bounds) {
  const min = bounds.min.clone();
  const size = bounds.getSize(new THREE.Vector3());
  size.x = Math.max(size.x,1e-6);
  size.z = Math.max(size.z,1e-6);

  const local = new THREE.Vector3();
  const world = new THREE.Vector3();

  meshes.forEach(mesh => {
    mesh.geometry = mesh.geometry.clone();
    const pos = mesh.geometry.getAttribute("position");
    if (!pos) return;

    mesh.updateWorldMatrix(true,false);
    const uv = new Float32Array(pos.count*2);

    for (let i=0;i<pos.count;i++) {
      local.fromBufferAttribute(pos,i);
      world.copy(local).applyMatrix4(mesh.matrixWorld);

      /* One-to-one use of the SAME image as the triangle.
         No separate brain palette, lighting, tint, or tone mapping. */
      uv[i*2]   = THREE.MathUtils.clamp((world.x-min.x)/size.x,0,1);
      uv[i*2+1] = THREE.MathUtils.clamp((world.z-min.z)/size.z,0,1);
    }

    mesh.geometry.setAttribute("uv",new THREE.BufferAttribute(uv,2));
    mesh.material = new THREE.MeshBasicMaterial({
      map:sharedTexture,
      side:THREE.FrontSide,
      toneMapped:false
    });
  });
}

function centerAndFrame(root, meshes) {
  const visibleSet = new Set(meshes);
  root.traverse(o => {
    if (o.isMesh) o.visible = visibleSet.has(o);
  });

  const bounds = new THREE.Box3();
  meshes.forEach(m => bounds.expandByObject(m));
  if (bounds.isEmpty()) throw new Error("No visible brain geometry.");

  applyExactSharedTexture(meshes,bounds);

  const center = bounds.getCenter(new THREE.Vector3());
  brainGroup.clear();
  brainGroup.add(root);
  root.position.sub(center);

  const size = bounds.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x,size.y,size.z);
  const scale = 2.10 / Math.max(maxDim,1e-6);
  root.scale.setScalar(scale);

  radius = 8.8;
  updateCamera();
}

function updateCamera() {
  const sinPhi = Math.sin(phi);
  camera.position.set(
    radius*sinPhi*Math.sin(theta),
    radius*Math.cos(phi),
    radius*sinPhi*Math.cos(theta)
  );
  camera.lookAt(0,0,0);
}

const draco = new DRACOLoader();
draco.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.7/");
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

const MODEL_URLS = [
  "./models/brain.glb",
  "https://itayinbarr.github.io/brainproject/models/brain.glb"
];

function tryModel(i=0) {
  if (i>=MODEL_URLS.length) return;
  loader.load(
    MODEL_URLS[i],
    gltf => {
      try {
        const root = gltf.scene;
        cortexMeshes = selectCortex(root);
        if (!cortexMeshes.length) throw new Error("No brain meshes found.");
        centerAndFrame(root,cortexMeshes);
        fallback.classList.add("hidden");
      } catch(e) {
        console.warn(e);
        tryModel(i+1);
      }
    },
    undefined,
    () => tryModel(i+1)
  );
}
tryModel();

function resize() {
  const r = stage.getBoundingClientRect();
  const w = Math.max(1,Math.round(r.width));
  const h = Math.max(1,Math.round(r.height));
  renderer.setSize(w,h,false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize",resize);

stage.addEventListener("pointerdown",e=>{
  dragging=true;autoRotate=false;px=e.clientX;py=e.clientY;
  stage.setPointerCapture?.(e.pointerId);
});
stage.addEventListener("pointermove",e=>{
  if(!dragging)return;
  targetTheta -= (e.clientX-px)*0.007;
  targetPhi = THREE.MathUtils.clamp(targetPhi+(e.clientY-py)*0.007,0.35,2.75);
  px=e.clientX;py=e.clientY;
});
const endDrag=()=>{dragging=false};
stage.addEventListener("pointerup",endDrag);
stage.addEventListener("pointercancel",endDrag);
stage.addEventListener("wheel",e=>{
  e.preventDefault();
  autoRotate=false;
  radius=THREE.MathUtils.clamp(radius*(1+e.deltaY*0.0008),7.0,11);
},{passive:false});

function frame() {
  requestAnimationFrame(frame);
  resize();
  if(autoRotate && cortexMeshes.length && !dragging)targetTheta+=0.0012;
  theta += (targetTheta-theta)*0.08;
  phi += (targetPhi-phi)*0.08;
  updateCamera();
  renderer.render(scene,camera);
}
frame();
</script>
</body>
</html>
