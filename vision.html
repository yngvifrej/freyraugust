/* === V28 common site navigation === */
.site-header { z-index: 50; }
.site-nav-grid { align-items: start; row-gap: 10px; }
.main-nav {
  grid-column: 5 / span 8;
  display: flex;
  justify-content: flex-end;
  align-items: baseline;
  gap: clamp(14px, 1.65vw, 30px);
  font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
  font-size: clamp(12px, .95vw, 15px);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: .01em;
  text-transform: uppercase;
  white-space: nowrap;
}
.main-nav a { opacity: .44; transition: opacity 140ms ease; }
.main-nav a:hover,
.main-nav a:focus-visible,
.main-nav a[aria-current="page"] { opacity: 1; }

/* AUDIO becomes an actual page link while keeping the exact triangle geometry. */
.neon-triangle-labels-outside { z-index: 14 !important; }
.neon-triangle-labels-outside .label-audio {
  pointer-events: auto !important;
  cursor: pointer !important;
  text-decoration: none !important;
}
.neon-triangle-labels-outside .label-audio:hover,
.neon-triangle-labels-outside .label-audio:focus-visible {
  text-decoration: underline !important;
  text-decoration-thickness: 2px !important;
  text-underline-offset: 5px !important;
  outline: none !important;
}

/* Common editorial pages */
.content-page {
  min-height: calc(100svh - 92px);

  padding-bottom: clamp(72px, 10vh, 132px);
}

  letter-spacing: .02em;
  text-transform: uppercase;
  color: var(--muted);
}
.page-title {

  letter-spacing: -.055em;
  text-transform: uppercase;
}
.empty-space {
  min-height: clamp(260px, 48vh, 620px);
  border-bottom: 1px solid rgba(0,0,0,.14);
}

/* AUDIO page */
.audio-page .page-title { color: #66762c; }
.audio-list {

  border-top: 1px solid #000;
}
.audio-item {

  grid-template-columns: repeat(12, minmax(0, 1fr));
  column-gap: var(--gutter);
  padding: 18px 0 22px;
  border-bottom: 1px solid rgba(0,0,0,.20);
}
.audio-index {
  grid-column: 1 / span 1;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.2;
}
.audio-copy {
  grid-column: 2 / span 3;
  align-self: start;
}

  font-weight: 700;
  letter-spacing: -.02em;
}
.audio-copy p {
  margin: 0;
  font-size: 11px;
  line-height: 1.35;
  text-transform: uppercase;
  letter-spacing: .02em;
  color: var(--muted);
}
.audio-embed {
  grid-column: 5 / span 8;
}
.audio-embed iframe {
  width: 100%;
  height: 166px;
  display: block;
  border: 0;
  background: #f3f3f3;
}
.release-link {
  display: flex;

  align-items: flex-end;

  padding: 18px 0 8px;

  letter-spacing: -.025em;

@media (max-width: 900px) {
